<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backlog Safra — Retirada de Equipamentos</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <script
      src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
      defer
    ></script>
    <meta name="theme-color" content="#0056b3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Backlog Safra" />
    <link rel="apple-touch-icon" href="icon.svg" />
  </head>
  <body>
    <div id="loading-bar"></div>
    <header class="header">
      <div class="header-top">
        <div>
          <h1>Backlog Safra</h1>
          <p>
            Retirada de Equipamentos
            <span id="header-versao" class="header-versao"></span>
          </p>
        </div>
        <div id="header-user" class="header-user hidden">
          <span id="header-nome-tecnico"></span>
          <div class="header-btns">
            <button id="btn-admin" class="btn-admin hidden">Admin</button>
            <button id="btn-meu-historico" class="btn-meu-historico hidden">
              <i data-lucide="clock" class="icon icon-sm"></i> Histórico
            </button>
            <button id="btn-logout" class="btn-logout">Sair</button>
          </div>
        </div>
      </div>
    </header>

    <!-- ===== TELA DE LOGIN ===== -->
    <div id="tela-login" class="tela-login">
      <div class="login-card">
        <div class="login-logo">
          <i data-lucide="wrench" class="icon icon-login"></i>
        </div>
        <h2 class="login-titulo">Acesso ao Sistema</h2>
        <p class="login-subtitulo">Backlog Safra — EQS Engenharia</p>
        <div id="login-erro" class="login-erro hidden">
          Usuário ou senha incorretos.
        </div>
        <label class="login-label">Usuário</label>
        <input
          type="text"
          id="login-usuario"
          class="login-input"
          placeholder="seu.usuario"
          autocomplete="username"
        />
        <label class="login-label">Senha</label>
        <input
          type="password"
          id="login-senha"
          class="login-input"
          placeholder="••••••"
          autocomplete="current-password"
        />
        <button id="btn-entrar" class="btn-entrar">Entrar</button>
      </div>
    </div>

    <!-- ===== APP PRINCIPAL ===== -->
    <main class="container hidden" id="app-principal">
      <!-- Banner offline -->
      <div id="offline-banner" class="offline-banner hidden">
        <span id="offline-icone"
          ><i data-lucide="wifi-off" class="icon"></i
        ></span>
        <span id="offline-texto">Modo offline</span>
        <span id="offline-pendentes" class="offline-pendentes"></span>
      </div>

      <section class="filters" id="filters">
        <div class="search-row">
          <div class="search-wrapper">
            <input
              type="text"
              id="search"
              class="input-search"
              placeholder="Buscar por nome, contrato ou endereço..."
            />
            <button
              id="btn-limpar-busca"
              class="btn-limpar-busca hidden"
              aria-label="Limpar busca"
            >
              <i data-lucide="x" class="icon"></i>
            </button>
          </div>
          <button
            id="btn-toggle-filtros"
            class="btn-toggle-filtros"
            onclick="toggleFiltros()"
            aria-label="Filtros"
          >
            <i data-lucide="sliders-horizontal" class="icon icon-sm"></i>
            <span id="badge-filtros-ativos" class="badge-filtros hidden"></span>
          </button>
        </div>
        <div id="filtros-panel" class="filtros-panel hidden">
          <div class="filter-row">
            <select id="filter-cidade" class="input-select">
              <option value="">Cidade</option>
            </select>
            <select id="filter-bairro" class="input-select">
              <option value="">Bairro</option>
            </select>
            <select id="filter-status" class="input-select">
              <option value="">Status</option>
              <option value="Pendente">Pendente</option>
              <option value="Retirado">Retirado</option>
              <option value="Parcial">Parcial</option>
              <option value="Quebra">Quebra</option>
            </select>
            <select id="filter-tipo" class="input-select">
              <option value="">Tipo</option>
            </select>
            <select id="filter-tecnico" class="input-select hidden">
              <option value="">Técnico</option>
            </select>
            <select
              id="sort-qntd"
              class="input-select"
              onchange="alterarSortQntd(this.value)"
            >
              <option value="">Qtd equips.</option>
              <option value="mais">Mais equips.</option>
              <option value="menos">Menos equips.</option>
            </select>
            <select
              id="sort-rua"
              class="input-select hidden"
              onchange="alterarSortRua(this.value)"
            >
              <option value="az">A–Z</option>
              <option value="mais">Mais contratos</option>
              <option value="menos">Menos contratos</option>
            </select>
          </div>

          <!-- Intervalo de datas: linha inteira, senão os campos ficam
               espremidos numa coluna do grid -->
          <div class="filtro-range">
            <div class="filtro-range-campos">
              <label class="filtro-range-campo">
                <span>De</span>
                <input type="date" id="filter-data-ini" class="input-select" />
              </label>
              <label class="filtro-range-campo">
                <span>Até</span>
                <input type="date" id="filter-data-fim" class="input-select" />
              </label>
            </div>
          </div>

          <!-- Ações: mudam o modo da lista, não filtram — separadas de propósito -->
          <div class="filtro-acoes">
            <button id="btn-montar-rota" class="btn-filtro-acao">
              <i data-lucide="route" class="icon icon-sm"></i> Rota
            </button>
            <button id="btn-agrupar" class="btn-filtro-acao">
              <i data-lucide="layers" class="icon icon-sm"></i> Por rua
            </button>
          </div>

          <button id="btn-limpar-filtros" class="btn-limpar-filtros">
            Limpar filtros
          </button>
        </div>
      </section>

      <!-- Barra de meta por equipamentos (seriais retirados / QNTD) -->
      <button
        id="meta-barra"
        class="meta-barra hidden"
        onclick="abrirMetaDetalhe()"
      ></button>

      <p class="resultado-count" id="resultado-count">
        Carregando contratos...
      </p>
      <section id="lista-contratos" class="lista-contratos"></section>
      <div id="paginacao" class="paginacao hidden"></div>
    </main>

    <!-- ===== BARRA DE ROTA (fixa, visível só em modo rota) ===== -->
    <div id="barra-rota" class="barra-rota hidden"></div>

    <!-- ===== TELA HISTÓRICO PESSOAL ===== -->
    <div id="tela-historico-pessoal" class="tela-admin hidden">
      <div class="admin-topbar">
        <button id="btn-voltar-historico" class="btn-voltar-lista">
          <i data-lucide="arrow-left" class="icon icon-sm"></i> Voltar
        </button>
        <span class="admin-titulo">Meu Histórico</span>
      </div>
      <div class="mh-filtros">
        <select id="mh-filter-status" class="input-select">
          <option value="">Todos</option>
          <option value="Retirado">Retirado</option>
          <option value="Parcial">Parcial</option>
          <option value="Quebra">Quebra</option>
        </select>
        <input
          type="text"
          id="mh-search"
          class="input-search mh-search-input"
          placeholder="Buscar contrato ou endereço..."
        />
      </div>
      <div id="mh-conteudo" class="admin-conteudo"></div>
    </div>

    <!-- ===== TELA ADMIN ===== -->
    <div id="tela-admin" class="tela-admin hidden">
      <div class="admin-topbar">
        <button id="btn-voltar-lista" class="btn-voltar-lista">
          <i data-lucide="arrow-left" class="icon icon-sm"></i> Voltar
        </button>
        <span class="admin-titulo">Painel Administrativo</span>
      </div>
      <div class="admin-tabs" id="admin-tabs">
        <button class="admin-tab admin-tab-ativo" data-tab="metricas">
          <i data-lucide="bar-chart-2" class="icon icon-sm"></i> Métricas
        </button>
        <button class="admin-tab" data-tab="historico">
          <i data-lucide="list" class="icon icon-sm"></i> Histórico
        </button>
        <button class="admin-tab" data-tab="relatorio">
          <i data-lucide="download" class="icon icon-sm"></i> Relatório
        </button>
        <button class="admin-tab" data-tab="tecnicos">
          <i data-lucide="users" class="icon icon-sm"></i> Técnicos
        </button>
        <button class="admin-tab" data-tab="projecao">
          <i data-lucide="trending-up" class="icon icon-sm"></i> Projeção
        </button>
        <button class="admin-tab" data-tab="distribuir">
          <i data-lucide="user-plus" class="icon icon-sm"></i> Distribuir
        </button>
      </div>
      <div class="admin-filtros">
        <select id="adm-filter-cidade" class="input-select">
          <option value="">Cidade</option>
        </select>
        <select id="adm-filter-tecnico" class="input-select">
          <option value="">Técnico</option>
        </select>
        <select id="adm-filter-periodo" class="input-select">
          <option value="">Período</option>
          <option value="semana">Esta semana</option>
          <option value="mes">Este mês</option>
          <option value="mes-anterior">Mês anterior</option>
        </select>
      </div>
      <div id="admin-conteudo" class="admin-conteudo"></div>
    </div>

    <!-- ===== MODAL DE DETALHES ===== -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-fechar" id="modal-fechar">
          <i data-lucide="x" class="icon icon-sm"></i> Fechar
        </button>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- ===== MODAL META (detalhe por cidade e tipo) ===== -->
    <div id="modal-meta" class="modal hidden">
      <div class="modal-content">
        <div class="connect-header">
          <span class="connect-titulo">Meta de recuperação</span>
          <button class="modal-fechar" onclick="fecharMetaDetalhe()">
            <i data-lucide="x" class="icon icon-sm"></i> Fechar
          </button>
        </div>
        <div id="meta-body"></div>
      </div>
    </div>

    <!-- ===== MODAL CONNECT (admin) ===== -->
    <div id="modal-connect" class="modal hidden">
      <div class="modal-content connect-content">
        <div class="connect-header">
          <span class="connect-titulo">Dados para Connect</span>
          <button class="modal-fechar" onclick="fecharModalConnect()">
            <i data-lucide="x" class="icon icon-sm"></i> Fechar
          </button>
        </div>
        <div id="connect-body"></div>
        <button class="btn-copiar-tudo" onclick="copiarTudoConnect()">
          <i data-lucide="clipboard-copy" class="icon icon-sm"></i> Copiar tudo
        </button>
        <div id="connect-footer"></div>
      </div>
    </div>

    <!-- ===== MODAL DE TUTORIAL ===== -->
    <div id="modal-tutorial" class="modal hidden">
      <div class="modal-content tutorial-content">
        <div class="tutorial-header">
          <span class="tutorial-contador"
            >Passo <span id="tut-atual">1</span> de
            <span id="tut-total">1</span></span
          >
          <button id="tutorial-fechar" class="tutorial-fechar-btn">
            <i data-lucide="x" class="icon icon-sm"></i>
          </button>
        </div>
        <div class="tutorial-dots" id="tutorial-dots"></div>
        <div id="tutorial-body" class="tutorial-body"></div>
        <div class="tutorial-nav">
          <button id="tut-prev" class="btn-tut-nav">Anterior</button>
          <button id="tut-next" class="btn-tut-nav btn-tut-next">
            Próximo
          </button>
        </div>
      </div>
    </div>

    <!-- ===== BOTÃO TUTORIAL (fixo) ===== -->
    <button id="btn-tutorial" class="btn-tutorial" aria-label="Abrir tutorial">
      <i data-lucide="help-circle" class="icon icon-tutorial"></i>
    </button>

    <!-- ===== TOAST (notificações unificadas) ===== -->
    <div id="toast" class="toast hidden"></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
